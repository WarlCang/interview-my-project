<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{PROJECT}} — readiness card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0d1117; }
  .card {
    width: 1200px; height: 630px;
    background: linear-gradient(135deg, #0d1117 0%, #161b27 60%, #1a2030 100%);
    color: #e6edf3;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    padding: 56px 64px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  .card::after {
    content: ""; position: absolute; right: -120px; top: -120px;
    width: 460px; height: 460px; border-radius: 50%;
    background: radial-gradient(circle, {{ACCENT}}22 0%, transparent 70%);
  }
  .kicker { font-size: 22px; letter-spacing: .14em; text-transform: uppercase; color: #8b949e; }
  .project { font-size: 46px; font-weight: 700; margin-top: 10px; }
  .project .dim { color: #8b949e; font-weight: 400; }
  .main { display: flex; align-items: center; gap: 72px; }
  .readiness { display: flex; flex-direction: column; }
  .readiness .num { font-size: 168px; font-weight: 800; line-height: 1; color: {{ACCENT}}; letter-spacing: -.03em; }
  .readiness .label { font-size: 24px; color: #8b949e; margin-top: 6px; }
  .readiness .trend { font-size: 26px; margin-top: 10px; color: #e6edf3; }
  .stats { display: flex; flex-direction: column; gap: 18px; font-size: 30px; }
  .stats .row { display: flex; align-items: baseline; gap: 14px; }
  .stats .n { font-weight: 700; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .stats .what { color: #8b949e; font-size: 24px; }
  .verdict {
    font-size: 27px; line-height: 1.45; color: #c9d1d9;
    border-left: 4px solid {{ACCENT}}; padding-left: 22px; max-width: 980px;
    font-style: italic;
  }
  .footer { display: flex; justify-content: space-between; align-items: baseline; color: #8b949e; font-size: 21px; }
  .footer .brand { font-weight: 600; color: #e6edf3; }
</style>
</head>
<body>
<div class="card">
  <div>
    <div class="kicker">{{KICKER}}</div>
    <div class="project">{{PROJECT}} <span class="dim">· {{DATE}}</span></div>
  </div>
  <div class="main">
    <div class="readiness">
      <div class="num">{{READINESS}}%</div>
      <div class="label">{{READINESS_LABEL}}</div>
      <div class="trend">{{TREND}}</div>
    </div>
    <div class="stats">
      <div class="row"><span>🟢</span><span class="n">{{SOLID}}</span><span class="what">{{SOLID_LABEL}}</span></div>
      <div class="row"><span>🟡</span><span class="n">{{SHAKY}}</span><span class="what">{{SHAKY_LABEL}}</span></div>
      <div class="row"><span>🔴</span><span class="n">{{FAILED}}</span><span class="what">{{FAILED_LABEL}}</span></div>
    </div>
  </div>
  <div class="verdict">“{{VERDICT}}”</div>
  <div class="footer">
    <span class="brand">interview-my-project</span>
    <span>{{TAGLINE}}</span>
  </div>
</div>
</body>
</html>
